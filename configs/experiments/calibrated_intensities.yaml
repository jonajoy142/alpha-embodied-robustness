# Calibrated fault intensities for Alpha v2 matrix
F1_sensor_lag:
  description: "Observation staleness duration in seconds"
  low: 0.50
  medium: 0.75
  high: 1.00
F2_grip_slip:
  description: "Grip constraint release probability during lift phase"
  low: 0.30
  medium: 0.50
  high: 0.70
F3_unreachable_ik:
  description: "End-effector target offset magnitude in meters (low allows partial success under 0.08m tolerance)"
  low: 0.05
  medium: 0.12
  high: 0.25
F4_planner_corruption:
  description: "Probability of schema key deletion / syntax corruption at serialization boundary"
  low: 0.30
  medium: 0.50
  high: 0.80
